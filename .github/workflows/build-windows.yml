name: Build Windows app

on:
  push:
    branches: [main]       # every push to main builds the installer and publishes release v<version> from package.json
  workflow_dispatch:       # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build:renderer

      - name: Build installer and publish GitHub Release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: Altruist-Trackers-Windows
          path: |
            dist/*.exe
            dist/latest.yml
