function tableHTML(){const l=filtered(),cs=visCols();
const head=`<tr><th class="s0" style="min-width:44px">#</th><th class="s1" style="min-width:40px"></th>${cs.map((c,j)=>`<th class="${j===0?'s2':''}" data-act="sort" data-k="${c.k}" style="min-width:${c.w}px">${esc(c.l)}${U.sort===c.k?(U.dir>0?' ▲':' ▼'):''}</th>`).join('')}</tr>`;
return`<table id="tbl"><thead>${head}</thead><tbody id="tb">${l.map(rowHTML).join('')}</tbody></table>${l.length?'':'<div class="empty">No records match. Use Add record or Bulk upload to get started.</div>'}`}
function footHTML(){const l=filtered(),s=stats(l);return`<span>Showing <b>${l.length}</b> of ${S.records.length}</span><span>Open value <b>${fmt(s.pipe)||'₹0'}</b></span><span>Weighted <b>${fmt(s.wtd)||'₹0'}</b></span><span>Won <b>${fmt(s.wonVal)||'₹0'}</b></span><span>Win rate <b>${pct(s.wr)}</b></span>`}
function pipelineView(){return`<div class="kpis" id="kpis">${kpiHTML(S.records)}</div><div class="bar"><div class="chips" id="chips">${chipsHTML()}</div><label class="search">${ic('search')}<input id="q" placeholder="Search client, ref no, owner…" value="${esc(U.q)}" aria-label="Search records"></label></div><div class="tcard"><div class="tscroll" id="tw">${tableHTML()}</div><div class="tfoot" id="tfoot">${footHTML()}</div></div>`}
function funnel(list){const mx=Math.max(1,...STAGES.map(s=>list.filter(r=>r.stage==s[0]).length));return STAGES.map(s=>{const l=list.filter(r=>r.stage==s[0]),v=l.reduce((a,r)=>a+(val(r)||0),0);return`<div class="fr"><div class="nm"><i>${s[0]}</i>${s[1]}</div><div class="tr"><b style="width:${l.length/mx*100}%;background:${GC[grp(s[0])]}"></b></div><div class="v">${l.length} · ${s[2]}%</div><div class="v">${fmt(v)||'–'}</div></div>`}).join('')}
function typeTable(list){return`<table class="mini"><thead><tr><th>Type</th><th class="r">Records</th><th class="r">Open</th><th class="r">Won</th><th class="r">Lost</th><th class="r">Win rate</th><th class="r">Pipeline</th><th class="r">Weighted</th></tr></thead><tbody>${TYPES.map(t=>{const s=stats(list.filter(r=>r.type===t));return`<tr><td><span class="pill t-${tc(t)}">${t}</span></td><td class="r">${s.n}</td><td class="r">${s.open}</td><td class="r">${s.won}</td><td class="r">${s.lost}</td><td class="r">${pct(s.wr)}</td><td class="r">${fmt(s.pipe)||'–'}</td><td class="r">${fmt(s.wtd)||'–'}</td></tr>`}).join('')}</tbody></table>`}
function deadlines(list,days){return list.filter(r=>{const d=daysLeft(r);return d!=null&&d>=0&&d<=days}).sort((a,b)=>daysLeft(a)-daysLeft(b))}
function liHTML(r,extra){const d=daysLeft(r);return`<div class="li" data-act="open" data-id="${r.id}"><div><b>${esc(r.client)||'Untitled'}</b><small>${esc(r.refNo||r.category||r.type)} · ${stOf(r)[1]}</small></div><div style="text-align:right">${extra||''}${d!=null?`<small class="${d<=7?'d-red':d<=21?'d-amb':'d-grn'}">${d}d left</small>`:''}</div></div>`}
function leaderTable(){const rows=ownersAll().map(n=>({n,s:stats(S.records.filter(r=>r.owner===n))})).filter(x=>x.n!=='Unassigned'||x.s.n);
return`<table class="mini"><thead><tr><th>BD person</th><th class="r">Records</th><th class="r">Open</th><th class="r">Won</th><th class="r">Lost</th><th class="r">Win rate</th><th class="r">Pipeline</th><th class="r">Weighted</th><th class="r">Won value</th></tr></thead><tbody>${rows.map(x=>`<tr class="lk" data-act="person" data-v="${esc(x.n)}"><td><b>${esc(x.n)}</b></td><td class="r">${x.s.n}</td><td class="r">${x.s.open}</td><td class="r">${x.s.won}</td><td class="r">${x.s.lost}</td><td class="r">${pct(x.s.wr)}</td><td class="r">${fmt(x.s.pipe)||'–'}</td><td class="r">${fmt(x.s.wtd)||'–'}</td><td class="r">${fmt(x.s.wonVal)||'–'}</td></tr>`).join('')}</tbody></table>`}
function overviewView(){const R=S.records,dl=deadlines(R,60),top=R.filter(r=>['Open','Stalled'].includes(status(r))).sort((a,b)=>(val(b)||0)*probOf(b)-(val(a)||0)*probOf(a)).slice(0,5);
return`<div class="kpis">${kpiHTML(R)}</div><div class="grid"><div class="panel c8"><h3>Pipeline by ${MODE==='rfp'?'stage · records, probability, value':'status · records, probability, monthly revenue'}</h3>${funnel(R)}</div><div class="panel c4"><h3>${MODE==='rfp'?'Upcoming deadlines · next 60 days':'Next actions due · next 60 days'}</h3>${dl.length?dl.map(r=>liHTML(r,fmt(val(r)))).join(''):'<div class="empty">No open deadlines in the next 60 days.</div>'}</div><div class="panel c7"><h3>Performance by record type</h3>${typeTable(R)}</div><div class="panel c5"><h3>Top open opportunities · weighted value</h3>${top.length?top.map(r=>liHTML(r,fmt((val(r)||0)*probOf(r)/100)+' weighted<br>')).join(''):'<div class="empty">No open opportunities.</div>'}</div><div class="panel c12"><h3>Team leaderboard · select a person for their page</h3>${leaderTable()}</div></div>`}
function teamView(){return`<div class="grid"><div class="panel c12"><h3>Team performance</h3>${leaderTable()}</div></div>`}
function personView(name){const list=S.records.filter(r=>r.owner===name),s=stats(list),t=stats(S.records);
const tiles=[['Records',s.n,`${s.open} open · ${s.stalled} stalled`,'blue'],['Open pipeline'+MO,fmt(s.pipe)||'₹0','Total open value','purple'],['Weighted pipeline'+MO,fmt(s.wtd)||'₹0','Value × probability','blue'],['Won value'+MO,fmt(s.wonVal)||'₹0',`${s.won} won`,'green'],['Win rate',pct(s.wr),`Team ${pct(t.wr)} · ${s.won} won / ${s.lost} lost`,'amber'],['Avg open deal'+MO,s.open?fmt(s.pipe/s.open):'–','Open pipeline ÷ open records','red']];
const dl=deadlines(list,60),act=list.filter(r=>r.nextAction&&['Open','Stalled'].includes(status(r)));
return`<div class="ph"><div class="av">${esc(name.slice(0,1).toUpperCase())}</div><div style="flex:1"><h2>${esc(name)}</h2><div class="sub">BD owner · performance review</div></div><button class="btn" data-act="exportperson" data-v="${esc(name)}">${ic('dn')} Export report</button>${name!=='Unassigned'?`<button class="btn dng" data-act="rmperson" data-v="${esc(name)}">${ic('tr')} Remove</button>`:''}</div>
<div class="kpis">${tiles.map(x=>`<div class="kpi k-${x[3]}"><div class="kl">${x[0]}</div><div class="kv">${x[1]}</div><div class="ks">${x[2]}</div></div>`).join('')}</div>
<div class="grid"><div class="panel c7"><h3>Stage distribution</h3>${funnel(list)}</div><div class="panel c5"><h3>${MODE==='rfp'?'Closing soon · next 60 days':'Actions due · next 60 days'}</h3>${dl.length?dl.map(r=>liHTML(r,fmt(val(r)))).join(''):'<div class="empty">Nothing closing in the next 60 days.</div>'}<h3 style="margin-top:18px">Next actions</h3>${act.length?act.map(r=>`<div class="li" data-act="open" data-id="${r.id}"><div><b>${esc(r.client)}</b><small>${esc(r.nextAction)}</small></div><small>${dstr(r.nextDate)}</small></div>`).join(''):'<div class="empty">No next actions logged.</div>'}</div>
<div class="panel c12"><h3>Performance by record type</h3>${typeTable(list)}</div>
<div class="panel c12"><h3>All records</h3><table class="mini"><thead><tr><th>Client</th><th>Type</th><th>Stage</th><th class="r">Prob.</th><th class="r">Value</th><th>${MODE==='rfp'?'Closing':'Next action'}</th><th class="r">Days</th></tr></thead><tbody>${list.map(r=>{const d=daysLeft(r);return`<tr class="lk" data-act="open" data-id="${r.id}"><td><b>${esc(r.client)||'Untitled'}</b></td><td><span class="pill t-${tc(r.type)}">${r.type}</span></td><td><span class="pill g-${grp(+r.stage)}">${stOf(r)[1]}</span></td><td class="r">${probOf(r)}%</td><td class="r">${fmt(val(r))||'–'}</td><td>${dstr(dueOf(r))}</td><td class="r">${d==null?'':d}</td></tr>`}).join('')||'<tr><td colspan="7" class="empty">No records assigned.</td></tr>'}</tbody></table></div></div>`}
function lkSel(r,t){const o=t==='c'?S.comm.filter(x=>!x.rfpId).map(x=>[x.id,(x.client||'(no client)')+(x.process?' – '+x.process:'')]):S.rfp.filter(x=>!x.commId).map(x=>[x.id,(x.client||'(no client)')+' '+(x.refNo||'')]);if(!o.length)return'<span class="cv" style="color:#9aa9c2">–</span>';return`<select class="lks" data-lk="${r.id}"><option value="">Link…</option>${o.map(x=>`<option value="${x[0]}">${esc(x[1])}</option>`).join('')}</select>`}

function custInput(r,c,mode){const v=(r.custom||{})[c.k?c.k.slice(2):c.key],f=c.fmt||'text',key=c.k?c.k.slice(2):c.key,a=MODE==='ai'?`data-ai="1" data-id="${r.id}" data-k="c:${key}" data-cfmt="${f}"`:mode==='drawer'?`data-f="c:${key}" data-cfmt="${f}"`:`data-id="${r.id}" data-k="c:${key}" data-cfmt="${f}"`,cl=mode==='drawer'?'':'cell ';
switch(f){
case'number':return`<input class="${cl}num" type="number" step="any" ${a} value="${v==null?'':esc(v)}">`;
case'percent':return`<input class="${cl}num" type="number" min="0" max="100" step="any" ${a} placeholder="0–100 %" value="${v==null?'':esc(v)}">`;
case'currency':return`<input class="${cl}num" ${a} placeholder="amount in ₹" value="${v==null||v===''?'':fmt(v)}">`;
case'date':return`<input class="${cl}" type="date" ${a} value="${esc(v)}">`;
case'yesno':return`<select class="${cl}" ${a}><option value=""></option>${['Yes','No'].map(o=>`<option${o===v?' selected':''}>${o}</option>`).join('')}</select>`;
case'list':return`<select class="${cl}" ${a}><option value=""></option>${(c.opts||[]).map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
default:return`<input class="${cl}" ${a} value="${esc(v)}">`}}
function custCell(r,c){return custInput(r,c,'cell')}
function custField(r,c){return`<label class="fld"><span>${esc(c.label)} · ${FMTN[c.fmt||'text']}</span>${custInput(r,c,'drawer')}</label>`}

/* ---------- AI solutions tracker ---------- */
const AIST=['Launched','Won','Warm','Cold','Lost'];
const AIC={Launched:'g-late',Won:'g-won',Warm:'g-stall',Cold:'g-early',Lost:'g-lost'};
const AICOL={Launched:'#7c3aed',Won:'#0f9d6b',Warm:'#dd7a0b',Cold:'#8ea4c6',Lost:'#dc2626'};
const AICOLS=[['client','Client Name',230],['processOwner','Process Owner',170],['itSpoc','IT SPOC',170],['solutions','Solutions Offered',290],['status','Status',150],['rev','Estimated Monthly Revenue (₹)',210],['remarks','Remarks',320]];
function blankA(){return{id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),ts:Date.now(),client:'',processOwner:'',itSpoc:'',solutions:'',status:'Warm',rev:null,remarks:'',custom:{}}}
const aiN=s=>S.ai.filter(r=>r.status===s).length;
const aiSum=s=>S.ai.filter(r=>r.status===s).reduce((a,r)=>a+(+r.rev||0),0);
function aiFiltered(){let l=S.ai.slice();if(AIST.includes(U.chip))l=l.filter(r=>r.status===U.chip);const q=U.q.trim().toLowerCase();if(q)l=l.filter(r=>[r.client,r.processOwner,r.itSpoc,r.solutions,r.remarks].join(' ').toLowerCase().includes(q));return l}
function aiKpiHTML(){const d=aiN('Launched')+aiN('Won')+aiN('Lost');const t=[['Clients',S.ai.length,`${aiN('Launched')} launched · ${aiN('Won')} won`,'blue'],['Launched revenue · monthly',fmt(aiSum('Launched'))||'₹0',`Annual ${fmt(aiSum('Launched')*12)||'₹0'}`,'purple'],['Won revenue · monthly',fmt(aiSum('Won'))||'₹0',`${aiN('Won')} won, not yet launched`,'green'],['Warm pipeline · monthly',fmt(aiSum('Warm'))||'₹0',`${aiN('Warm')} warm · ${aiN('Cold')} cold`,'amber'],['Conversion',d?pct((aiN('Launched')+aiN('Won'))/d):'–',`${aiN('Launched')+aiN('Won')} converted · ${aiN('Lost')} lost`,'red']];
return t.map(x=>`<div class="kpi k-${x[3]}"><div class="kl">${x[0]}</div><div class="kv">${x[1]}</div><div class="ks">${x[2]}</div></div>`).join('')}
function aiChipsHTML(){return[['all','All',S.ai.length,'']].concat(AIST.map(s=>[s,s,aiN(s),AICOL[s]])).map(x=>`<button class="chip${U.chip===x[0]?' on':''}" data-act="aichip" data-v="${x[0]}">${x[3]?`<span class="d" style="background:${x[3]}"></span>`:''}${x[1]} <em>${x[2]}</em></button>`).join('')}
function aiFootHTML(){const l=aiFiltered(),sum=l.reduce((a,r)=>a+(+r.rev||0),0);return`<span>Showing <b>${l.length}</b> of ${S.ai.length}</span><span>Estimated monthly revenue (shown rows) <b>${fmt(sum)||'₹0'}</b></span><span>Launched <b>${fmt(aiSum('Launched'))||'₹0'}</b></span><span>Won <b>${fmt(aiSum('Won'))||'₹0'}</b></span><span>Warm <b>${fmt(aiSum('Warm'))||'₹0'}</b></span>`}
function aiCell(r,k){if(k.startsWith('c:')){const c=S.customCols.find(x=>x.key===k.slice(2));return c?custCell(r,c):''}const a=`data-ai="1" data-id="${r.id}" data-k="${k}"`;
if(k==='status')return`<select class="cell pillsel ${AIC[r.status]||'g-early'}" ${a}>${AIST.map(s=>`<option${s===r.status?' selected':''}>${s}</option>`).join('')}</select>`;
if(k==='rev')return`<input class="cell num" ${a} data-money="1" placeholder="amount in ₹" value="${r.rev==null?'':fmt(r.rev)}">`;
return`<input class="cell" ${a} value="${esc(r[k])}">`}
function aiVisCols(){const h=S.hidden;return allCols().filter(c=>c.k==='client'||!h.includes(c.k)).map(c=>[c.k,c.l,c.w])}
function aiTableHTML(){const l=aiFiltered(),VC=aiVisCols();return`<table id="aitbl"><thead><tr><th class="s0" style="min-width:44px">#</th><th class="s1" style="min-width:40px"></th>${VC.map((c,j)=>`<th class="${j===0?'s2':''}" style="min-width:${c[2]}px">${esc(c[1])}</th>`).join('')}</tr></thead><tbody id="aitb">${l.map((r,i)=>`<tr data-id="${r.id}"><td class="rn s0" style="min-width:44px">${i+1}</td><td class="s1" style="min-width:40px"><button class="ob" data-act="aiopen" data-id="${r.id}" title="Open row details" aria-label="Open row details">${ic('open')}</button></td>${VC.map((c,j)=>`<td class="${j===0?'s2 cl':''}${c[0]==='rev'?' r':''}" style="min-width:${c[2]}px">${aiCell(r,c[0])}</td>`).join('')}</tr>`).join('')}</tbody></table>${l.length?'':'<div class="empty">No rows yet. Use Add row or Bulk upload to start tracking AI solutions.</div>'}`}
function aiView(){return`<div class="kpis" id="aik">${aiKpiHTML()}</div><div class="bar"><div class="chips" id="aichips">${aiChipsHTML()}</div><label class="search">${ic('search')}<input id="q" placeholder="Search client, owner, SPOC, solution…" value="${esc(U.q)}" aria-label="Search rows"></label></div><div class="tcard"><div class="tscroll" id="aitw">${aiTableHTML()}</div><div class="tfoot" id="aif">${aiFootHTML()}</div></div>`}
function aiEdit(el,final){const r=S.ai.find(x=>x.id===el.dataset.id);if(!r)return;const k=el.dataset.k;
if(k.startsWith('c:')){if(commitValue(r,k,el,final))touch(r.id);return}

if(el.closest('.drawer')){const t=document.querySelector(`#aitb [data-id="${r.id}"][data-k="${k}"]`);if(t&&t!==document.activeElement){t.value=k==='rev'?(r.rev==null?'':fmt(r.rev)):r[k];if(k==='status')t.className='cell pillsel '+AIC[r.status]}const dt=$('#dt');if(dt)dt.textContent=r.client||'New row'}
const kp=$('#aik');if(kp){kp.innerHTML=aiKpiHTML();$('#aichips').innerHTML=aiChipsHTML();$('#aif').innerHTML=aiFootHTML()}}
